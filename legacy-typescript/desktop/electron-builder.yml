appId: com.llmapidoctor.desktop
productName: LLM API Doctor
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - nsis
  artifactName: LLM-API-Doctor-${version}-Setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: LLM-API-Doctor-${version}-Portable.${ext}
