name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item target/release/llm-api-doctor-desktop.exe artifacts/LLM-API-Doctor.exe
          Copy-Item target/release/llm-api-doctor.exe artifacts/llm-api-doctor-cli.exe
          Get-FileHash artifacts/*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content artifacts/SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" artifacts/* --generate-notes --title "LLM API Doctor ${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
