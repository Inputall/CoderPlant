[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/desktop"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["LLM API Doctor contributors"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
eframe = "0.31"
egui = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
